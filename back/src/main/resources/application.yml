server:
  port: 8080

spring:
  application:
    name: qa-application
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 1MB

  # Database Configuration (H2 for development)
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

qa:
  workspace:
    before-path: ${QA_WORKSPACE_BEFORE:./workspace/before}
    after-path: ${QA_WORKSPACE_AFTER:./workspace/after}
    dev-path: C:/Dev/doc/jsonl
    masked-path: C:/Dev/doc/masked

