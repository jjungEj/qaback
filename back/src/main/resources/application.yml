server:
  port: 8080

spring:
  application:
    name: qa-application
  
  # Database Configuration (H2 for development)
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

